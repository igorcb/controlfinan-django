{% load ui %}<form class="card space-y-4" action="{% if current_account.pk %}{% url 'current_account' current_account.pk %}{% else %}{% url 'current_accounts' %}{% endif %}" method="post">{% csrf_token %}
  {% if errors %}
    <div class="rounded-md bg-red-50 px-4 py-3 text-sm text-red-800">
      <ul class="list-inside list-disc">
        {% for message in errors %}<li>{{ message }}</li>{% endfor %}
      </ul>
    </div>
  {% endif %}

  <div class="grid grid-cols-2 gap-2" role="radiogroup" aria-label="Tipo">
    <label class="flex cursor-pointer items-center justify-center rounded-md border border-slate-300 py-3 font-medium text-slate-600 has-checked:border-red-600 has-checked:bg-red-600 has-checked:text-white">
      <input class="sr-only" type="radio" value="debito"{% if current_account.type_launche == -1 %} checked="checked"{% endif %} name="current_account[type_launche]" id="current_account_type_launche_debito"> Débito
    </label>
    <label class="flex cursor-pointer items-center justify-center rounded-md border border-slate-300 py-3 font-medium text-slate-600 has-checked:border-emerald-600 has-checked:bg-emerald-600 has-checked:text-white">
      <input class="sr-only" type="radio" value="credito"{% if current_account.type_launche == 1 %} checked="checked"{% endif %} name="current_account[type_launche]" id="current_account_type_launche_credito"> Crédito
    </label>
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    <div>
      <label class="label" for="current_account_price">Valor</label>
      <input step="0.01" min="0.01" placeholder="0,00" inputmode="decimal"{% if not current_account.pk %} autofocus="autofocus"{% endif %} class="input text-lg font-semibold" type="number" value="{{ current_account.price|decimal_text }}" name="current_account[price]" id="current_account_price">
    </div>

    <div>
      <label class="label" for="current_account_date_ocurrence">Data</label>
      <input class="input" type="date" value="{{ current_account.date_ocurrence|iso }}" name="current_account[date_ocurrence]" id="current_account_date_ocurrence">
    </div>

    <div>
      <label class="label" for="current_account_cost_id">Categoria</label>
      <select class="input" name="current_account[cost_id]" id="current_account_cost_id"><option value="">Selecione</option>
        {% for id, name in costs %}<option{% if current_account.cost_id == id %} selected="selected"{% endif %} value="{{ id }}">{{ name }}</option>{% endfor %}
      </select>
    </div>

    <div>
      <label class="label" for="current_account_cash_account_id">Conta</label>
      <select class="input" name="current_account[cash_account_id]" id="current_account_cash_account_id"><option value="">Selecione</option>
        {% for id, name in cash_accounts %}<option{% if current_account.cash_account_id == id %} selected="selected"{% endif %} value="{{ id }}">{{ name }}</option>{% endfor %}
      </select>
    </div>

    <div class="sm:col-span-2">
      <label class="label" for="current_account_historic">Histórico</label>
      <input class="input" type="text" value="{{ current_account.historic|default_if_none:'' }}" name="current_account[historic]" id="current_account_historic">
    </div>
  </div>

  <div class="flex flex-col-reverse gap-3 sm:flex-row">
    <a class="btn-secondary py-3 sm:py-2" href="{% if current_account.pk %}{% url 'current_account' current_account.pk %}{% else %}{% url 'current_accounts' %}{% endif %}">Cancelar</a>
    <input type="submit" value="Salvar" class="btn-primary py-3 sm:order-first sm:py-2">
  </div>
</form>
