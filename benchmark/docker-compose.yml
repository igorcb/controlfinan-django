# Rails 8 + Hotwire vs Django, both in production mode with the same limits and the same data.
# Run with ./benchmark/run.sh (it reads the Rails master key from the Rails repo; nothing secret is stored here).
x-db: &db
  image: postgres:16-alpine
  environment:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
  cpus: 2
  mem_limit: 1g
  tmpfs: /var/lib/postgresql/data

services:
  rails-db:
    <<: *db
  django-db:
    <<: *db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: controlfinan_django

  rails:
    build: ${RAILS_APP:-../../controlfinan-rails8-hotwire}
    image: bench-rails
    cpus: 2
    mem_limit: 1g
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      APP_DATABASE_PASSWORD: app
      DATABASE_URL: postgresql://app:app@rails-db:5432/app_production
      CACHE_DATABASE_URL: postgresql://app:app@rails-db:5432/app_production_cache
      QUEUE_DATABASE_URL: postgresql://app:app@rails-db:5432/app_production_queue
      CABLE_DATABASE_URL: postgresql://app:app@rails-db:5432/app_production_cable
      RAILS_MAX_THREADS: 5
      RAILS_LOG_LEVEL: warn
    # Puma directly (no Thruster proxy), 2 processes x 5 threads, like Gunicorn below.
    command: ["bash", "-c", "./bin/rails db:prepare && exec bundle exec puma -e production -w 2 -t 5:5 -p 3000"]
    ports: ["3101:3000"]
    depends_on: [rails-db]

  django:
    build:
      context: ..
      dockerfile: Dockerfile.prod
    image: bench-django
    cpus: 2
    mem_limit: 1g
    environment:
      DJANGO_SECRET_KEY: benchmark-only-secret
      DATABASE_URL: postgresql://app:app@django-db:5432/controlfinan_django
      BCRYPT_COST: 12
      WEB_CONCURRENCY: 2
      THREADS: 5
    ports: ["8101:8000"]
    depends_on: [django-db]

  k6:
    image: grafana/k6:0.54.0
    profiles: ["tools"]
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
