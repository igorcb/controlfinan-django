services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: controlfinan_django
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/controlfinan_django
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    depends_on:
      - db

volumes:
  db_data:
